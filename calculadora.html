    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <div class="topo">
            <img src="img/logotipo/Titulo IGMANI.png" alt="IGMANI GLICO logo">
        </div>
        <div class="topo2">
            <ul>
                <li><a href="index.html"> Home </a></li>
                <li><a href="sobre.html">Sobre</a></li>

    <!--<section class="banner">
        <source media="(min-width: )" srcset="">
        <img src="img/banner_principalV2.png" alt="Banner IGMANI">
    </section>-->

    <div class="container">

      <section class="calculadora">
        <h2 class="titulo">Calculadora de Carga Glicêmica por Refeição</h2>
        <p class="calculadora_subtitulo">Adicione os alimentos do seu prato para calcular o impacto total da refeição.</p>


        <div class="calculadoraa">
            <div class="escolha_alimento">
                <label for="alimento">Selecione o Alimento:</label>
                <select id="alimento">
                    <option value="banana" data-ig="51" data-carbo="23">Banana Nanica (100g)</option>
                    <option value="maca" data-ig="36" data-carbo="14">Maçã (100g)</option>
                    <option value="laranja" data-ig="43" data-carbo="12">Laranja (100g)</option>
                    <option value="morango" data-ig="41" data-carbo="8">Morango (100g)</option>
                    <option value="melancia" data-ig="72" data-carbo="8">Melancia (100g)</option>
                    <option value="abacaxi" data-ig="59" data-carbo="13">Abacaxi (100g)</option>
                    <option value="mamao" data-ig="60" data-carbo="11">Mamão Papaia (100g)</option>
                    <option value="uva" data-ig="53" data-carbo="18">Uva Itália (100g)</option>

                    <!-- Pães, Massas e Cereais -->
                    <option value="pao-frances" data-ig="70" data-carbo="50">Pão Francês (100g)</option>
                    <option value="pao-integral" data-ig="51" data-carbo="43">Pão de Forma Integral (100g)</option>
                    <option value="tapioca" data-ig="70" data-carbo="54">Massa de Tapioca (100g)</option>
                    <option value="aveia" data-ig="55" data-carbo="66">Aveia em Flocos (100g)</option>
                    <option value="macarrao-cozido" data-ig="49" data-carbo="31">Macarrão Espaguete Cozido (100g)</option>
                    <option value="macarrao-integral" data-ig="42" data-carbo="26">Macarrão Integral Cozido (100g)</option>
                    <option value="cuscuz-milho" data-ig="65" data-carbo="23">Cuscuz de Milho Cozido (100g)</option>

                    <!-- Arroz, Tubérculos e Leguminosas -->
                    <option value="arroz-branco" data-ig="73" data-carbo="28">Arroz Branco Cozido (100g)</option>
                    <option value="arroz-integral" data-ig="68" data-carbo="23">Arroz Integral Cozido (100g)</option>
                    <option value="batata-inglesa" data-ig="78" data-carbo="17">Batata Inglesa Cozida (100g)</option>
                    <option value="batata-doce" data-ig="63" data-carbo="20">Batata Doce Cozida (100g)</option>
                    <option value="mandioca" data-ig="46" data-carbo="38">Mandioca Cozida (100g)</option>
                    <option value="feijao-preto" data-ig="30" data-carbo="14">Feijão Preto Cozido (100g)</option>
                    <option value="feijao-carioca" data-ig="24" data-carbo="14">Feijão Carioca Cozido (100g)</option>
                    <option value="lentilha" data-ig="32" data-carbo="20">Lentilha Cozida (100g)</option>
                    <option value="grao-de-bico" data-ig="28" data-carbo="27">Grão-de-Bico Cozido (100g)</option>

                    <!-- Saladas e Vegetais -->
                    <option value="alface" data-ig="15" data-carbo="1.2" data-sugestao="">Alface Crespa / Americana (100g)</option>
                    <option value="rucula" data-ig="15" data-carbo="2.1" data-sugestao="">Rúcula (100g)</option>
                    <option value="espinafre" data-ig="15" data-carbo="1.4" data-sugestao="">Espinafre Cozido (100g)</option>
                    <option value="tomate" data-ig="38" data-carbo="3.9" data-sugestao="">Tomate (100g)</option>
                    <option value="pepino" data-ig="15" data-carbo="2.0" data-sugestao="">Pepino Japonês (100g)</option>
                    <option value="cenoura-crua" data-ig="30" data-carbo="9.6" data-sugestao="">Cenoura Ralada Crua (100g)</option>
                    <option value="cenoura-cozida" data-ig="49" data-carbo="8.2" data-sugestao="Consuma crua ou al dente para manter o IG mais baixo.">Cenoura Cozida (100g)</option>
                    <option value="brocolis" data-ig="15" data-carbo="4.0" data-sugestao="">Brócolis Cozido (100g)</option>
                    <option value="couve-flor" data-ig="15" data-carbo="5.0" data-sugestao="">Couve-Flor Cozida (100g)</option>
                    <option value="abobora" data-ig="75" data-carbo="6.5" data-sugestao="Combine com proteínas ou fibras (como chia) para reduzir o impacto.">Abóbora Cabotiá Cozida (100g)</option>
                    <option value="chuchu" data-ig="15" data-carbo="3.0" data-sugestao="">Chuchu Cozido (100g)</option>
                    <option value="beterraba" data-ig="64" data-carbo="9.5" data-sugestao="Consuma crua ralada para menor impacto glicémico.">Beterraba Cozida (100g)</option>

                    <!-- Proteínas, Laticínios e Gorduras -->
                    <option value="frango-grelhado" data-ig="0" data-carbo="0">Peito de Frango Grelhado (100g)</option>
                    <option value="carne-moida" data-ig="0" data-carbo="0">Carne Bovina Magra/Moída (100g)</option>
                    <option value="tilapia-grelhada" data-ig="0" data-carbo="0">Filé de Tilápia Grelhado (100g)</option>
                    <option value="ovo-cozido" data-ig="0" data-carbo="0.6">Ovo Cozido (1 unidade / 50g)</option>
                    <option value="leite-desnatado" data-ig="32" data-carbo="5">Leite Desnatado (100ml)</option>
                    <option value="iogurte-natural" data-ig="35" data-carbo="4.7">Iogurte Natural Integral (100g)</option>
                    <option value="queijo-cottage" data-ig="10" data-carbo="3.4">Queijo Cottage (100g)</option>
                    <option value="azeite" data-ig="0" data-carbo="0">Azeite de Oliva (1 colher de sopa)</option>
                </select>
            </div>

            <div class="quantidade_alimento">
                <label for="quantidade">Quantidade (gramas):</label>
                <input type="number" id="quantidade" placeholder="Ex: 150" min="1">
            </div>

            <button type="button" onclick="adicionarAlimento()" class="btn_adicionar">+ Adicionar ao Prato</button>

            <div class="prato_container">
    <div id="lista_prato"></div>

            <div class="total_container">
                <div class="bloco_total">
                    <span>Carga Glicêmica Total</span>
                    <strong id="cg_total">0.0</strong>
                </div>
                <div id="status_refeicao" class="status_refeicao">Adicione alimentos ao prato</div>
                
                <!-- Novo bloco de sugestões -->
                <div id="sugestoes_container" class="sugestoes_box" style="display: none;">
                    <h4>💡 Sugestões de Trocas Saudáveis:</h4>
                    <ul id="lista_sugestoes"></ul>
                </div>
            </div>
        </div>
    </div>





</section>

    </div>
</body>
</html>
